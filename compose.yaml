services:
  postgres:
    image: postgres:17-alpine
    container_name: animeverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-animeverse}
      POSTGRES_USER: ${POSTGRES_USER:-animeverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - animeverse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-animeverse} -d ${POSTGRES_DB:-animeverse}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  animeverse_pgdata:
    name: animeverse_pgdata
