name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: animeverse_ci
          POSTGRES_USER: animeverse
          POSTGRES_PASSWORD: ci_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U animeverse -d animeverse_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://animeverse:ci_ephemeral_password@localhost:5432/animeverse_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @animeverse/api db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test (unit + PostgreSQL integration, zero external provider network)
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: animeverse_e2e
          POSTGRES_USER: animeverse
          POSTGRES_PASSWORD: ci_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U animeverse -d animeverse_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://animeverse:ci_ephemeral_password@localhost:5432/animeverse_e2e
      API_PORT: '3000'
      API_HOST: '127.0.0.1'
      CORS_ORIGIN: 'http://127.0.0.1:4200,http://localhost:4200'
      E2E_BASE_URL: 'http://127.0.0.1:4200'
      E2E_API_URL: 'http://127.0.0.1:3000/api/v1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium)
        run: pnpm --filter @animeverse/web exec playwright install --with-deps chromium

      - name: Migrate and import fixture dataset
        run: |
          pnpm --filter @animeverse/api db:migrate
          pnpm --filter @animeverse/api dataset:import -- --file test/fixtures/anime-offline-sample.jsonl

      - name: Build packages
        run: pnpm build

      - name: Run Playwright E2E smoke (Chromium)
        run: |
          node apps/api/dist/server.js &
          API_PID=$!
          pnpm --filter @animeverse/web exec ng serve --host 127.0.0.1 --port 4200 &
          WEB_PID=$!
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/api/v1/health >/dev/null && curl -sf http://127.0.0.1:4200 >/dev/null; then
              break
            fi
            sleep 1
          done
          pnpm test:e2e:smoke
          kill $WEB_PID $API_PID || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
